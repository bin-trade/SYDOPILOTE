<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040d20">
  <meta name="description" content="Vérification des rapports douaniers par scan de code QR, y compris hors connexion.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EXTRACTOR">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>EXTRACTOR · Vérification</title>
</head>
<body data-screen="scan">

<!-- Icônes (sprite) -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <symbol id="i-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-registry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
    <symbol id="i-torch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M21 4v5h-5M3 20v-5h5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M21 4v5h-5M3 20v-5h5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M4 21h16"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 13h6M9 17h6"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- ÉCRAN 1 · SCANNER (accueil) -->
  <section class="screen screen-scan" id="screen-scan" aria-label="Scanner un rapport">
    <video id="video" playsinline muted autoplay></video>

    <header class="scan-top">
      <div class="brand-mini"><img src="./assets/icon-192.png" alt=""><span>EXTRACTOR</span></div>
      <div class="scan-actions">
        <span class="chip" id="netChip"><i></i><span>Hors ligne</span></span>
        <button class="round-btn" id="torchBtn" aria-label="Lampe torche" aria-pressed="false" hidden><svg class="ic"><use href="#i-torch"/></svg></button>
        <button class="round-btn" id="flipBtn" aria-label="Changer de caméra" hidden><svg class="ic"><use href="#i-flip"/></svg></button>
        <a class="round-btn" href="#/settings" aria-label="Réglages"><svg class="ic"><use href="#i-settings"/></svg></a>
      </div>
    </header>

    <div class="viewfinder" id="viewfinder" aria-hidden="true">
      <span class="vf-c tl"></span><span class="vf-c tr"></span><span class="vf-c bl"></span><span class="vf-c br"></span>
      <span class="vf-laser"></span>
    </div>

    <div class="scan-lower">
      <label class="agency-picker" for="agencySelect">
        <span>Agence à vérifier</span>
        <select id="agencySelect" aria-describedby="agencyStatus">
          <option value="">Synchronisez puis sélectionnez une agence</option>
        </select>
        <small id="agencyStatus">La sélection est obligatoire avant le scan.</small>
      </label>
      <p class="scan-hint" id="scanHint" role="status">Placez le QR code du rapport dans le cadre</p>
      <button class="pill-btn" id="photoBtn"><svg class="ic"><use href="#i-image"/></svg><span>Depuis une photo</span></button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <div class="cam-state" id="camState" hidden></div>
  </section>

  <!-- ÉCRAN 2 · HISTORIQUE -->
  <section class="screen" id="screen-history" aria-label="Historique" hidden></section>

  <!-- ÉCRAN 3 · REGISTRE -->
  <section class="screen" id="screen-registry" aria-label="Registre" hidden></section>

  <!-- ÉCRAN 4 · RÉSULTAT (plein écran) -->
  <section class="screen screen-result" id="screen-result" aria-label="Résultat de la vérification" hidden></section>

  <!-- ÉCRAN 5 · RÉGLAGES -->
  <section class="screen" id="screen-settings" aria-label="Réglages" hidden></section>

  <nav class="tabbar" aria-label="Navigation principale">
    <a class="tab" href="#/history" data-tab="history"><svg class="ic"><use href="#i-history"/></svg><span>Historique</span></a>
    <a class="tab tab-scan" href="#/scan" data-tab="scan" aria-label="Scanner"><svg class="ic"><use href="#i-scan"/></svg></a>
    <a class="tab" href="#/registry" data-tab="registry"><svg class="ic"><use href="#i-registry"/></svg><span>Registre</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
</div>

<noscript><p style="color:#fff;padding:24px">EXTRACTOR nécessite JavaScript.</p></noscript>
<script src="./config.js"></script>
<script src="./vendor/jsQR.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
